services:
  db:
    image: postgres:17
    container_name: login_with_go_vue
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: login_with_go_vue
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./internal/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d login_with_go_vue"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
